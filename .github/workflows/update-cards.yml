name: Update Profile Cards & Metrics

on:
  schedule:
    # Executes every night at 03:00 UTC (00:00 BRT)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metrics:
    name: Generate & Refresh Metric Cards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure cards directory exists
        run: mkdir -p profile-cards

      - name: Fetch Streak & Contributions Card
        run: |
          validate_xml() {
            python3 -c "import xml.etree.ElementTree as ET; ET.parse('$1')" 2>/dev/null
          }

          # Fetch GitHub Streak Stats Card
          curl -sS "https://streak-stats.demolab.com/?user=FelipeLipeee&theme=tokyonight&hide_border=true&cache_seconds=1800" -o profile-cards/streak.svg.tmp || true
          if [ -s profile-cards/streak.svg.tmp ] && ! grep -qi "something went wrong" profile-cards/streak.svg.tmp && validate_xml profile-cards/streak.svg.tmp; then
            mv profile-cards/streak.svg.tmp profile-cards/streak.svg
            echo "Successfully updated streak.svg"
          else
            echo "Streak card fetch failed or invalid XML; retaining existing SVG."
            rm -f profile-cards/streak.svg.tmp
          fi

      - name: Generate Multi-Theme Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: -3

      - name: Commit and Push Updated Cards
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add profile-cards/
          if git diff --staged --quiet; then
            echo "No changes detected in profile cards."
          else
            git commit -m "chore(metrics): auto-refresh static profile cards [skip ci]"
            git push origin main
          fi
